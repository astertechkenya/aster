<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page not found | Aster Tech Solutions</title>
  <!-- A dead address shouldn't show up in search results -->
  <meta name="robots" content="noindex" />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <!-- Netlify shows this page for ANY missing address (e.g. /old/page), so every link starts
       with "/": a relative "css/styles.css" would be looked for in /old/ and fail. -->
  <link rel="stylesheet" href="/css/styles.css" />
  <style>
    .lost { min-height: 70vh; display: grid; place-content: center; text-align: center; gap: 18px; padding-block: 64px; }
    .lost h1 { font-size: clamp(2.2rem, 6vw, 3.4rem); font-weight: 500; }
    .lost p { color: var(--ink-soft); max-width: 40ch; margin-inline: auto; }
    .lost .btn { justify-self: center; margin-top: 10px; }
  </style>
</head>
<body>
  <main class="wrap lost">
    <p class="eyebrow">404 — Off bearing</p>
    <h1>This page <em>isn&rsquo;t here</em></h1>
    <p>It may have moved, or the address has a typo.</p>
    <a class="btn btn-primary" href="/">Back to Aster</a>
  </main>
</body>
</html>
